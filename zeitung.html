<style>
:root{--paper:#F3F4EE;--surface:#FFFFFF;--clip:#FBFBF6;--ink:#1F2A23;--soft:#5B6A5F;--line:#D8DED2;--marker:#D4EC8E;--accent:#2E6B3C;--accent-ink:#FFFFFF;--chip:#EAF0E1;--ok:#1E7A45;--ok-bg:#E3F5EA;--warn:#8A5A00;--warn-bg:#FFF3D6;--bad:#B8213A;--bad-bg:#FCE6E9;color-scheme:light}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}

h2{font-size:26px;font-weight:700;margin:4px 0 8px}h3{font-size:20px;font-weight:700;margin:0 0 6px}

textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.task:focus-visible{outline:3px solid var(--marker);outline-offset:1px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip)}

.lvl{display:flex;gap:6px}.lvl span{width:30px;height:8px;border-radius:4px;background:var(--line)}.lvl span.on{background:var(--accent)}

.clip p{margin:0 0 10px}.clip p.lead{font-weight:700}.clip .by{font-size:14px;color:var(--soft);text-align:right;margin:0}
mark.er{background:transparent;color:inherit;text-decoration:underline wavy var(--bad);text-decoration-thickness:2px;text-underline-offset:3px}
mark.rp{color:#1F2A23;border-radius:3px;padding:0 2px}

.score{font-family:"Newsreader",Georgia,serif;font-size:60px;font-weight:800;line-height:1}
.bars{display:grid;grid-template-columns:110px 1fr 54px;gap:6px 10px;align-items:center;font-size:15px}
.bars .b{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.facts td:first-child{font-weight:700;white-space:nowrap;padding-right:10px}
.wit{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}.wit b{display:block}
.merk{background:var(--chip);border-radius:12px;padding:14px}
.note{font-size:14px;color:var(--soft)}
.hidden{display:none!important}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.phr h4{margin:10px 0 4px;font-size:15px}.phr ul{margin:0;padding-left:18px}.phr li{margin:2px 0}
.rules{margin:6px 0;padding-left:20px}.rules li{margin:3px 0}
.aist{font-size:14px;color:var(--soft);margin-top:8px}.aist:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox p{margin:0 0 14px}
details>summary{cursor:pointer}
@media (max-width:480px){.bars{grid-template-columns:96px 1fr 46px}.clip{padding:14px}}

<script>
/* ===================== HILFSFUNKTIONEN ===================== */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const LT='a-zäöüßA-ZÄÖÜ';
function wre(p,fl='i'){return new RegExp('(?<!['+LT+'])'+reEsc(p).replace(/\s+/g,'\\s+')+'(?!['+LT+'])',fl);}
const words=t=>(String(t||'').match(/[A-Za-zÄÖÜäöüß0-9]+(?:[-’'][A-Za-zÄÖÜäöüß0-9]+)*/g)||[]);
const wc=t=>words(t).length;
const W=[130,170];

/* ===================== AUFGABEN ===================== */
const TASKS=[
{id:'fussgaenger',title:'Schüler von Auto erfasst',de:'Unfall auf dem Schulweg',type:'fakten',ort:'St. Johann im Pongau',
 facts:[['Was?','Autounfall – ein PKW erfasst einen Fußgänger'],['Wer?','Schüler Muammar I. (13 J.) auf dem Heimweg von der Schule; PKW-Lenkerin Madlen M. (35 J.)'],['Wo?','Brechtstraße, St. Johann im Pongau'],['Wann?','Donnerstag, 21. Juni, gegen 13:30 Uhr'],['Wie/Warum?','Fußgänger betrat die Straße; PKW näherte sich, konnte nicht mehr rechtzeitig bremsen; PKW kollidierte mit dem Fußgänger; Fußgänger auf die Motorhaube geschleudert'],['Hilfe?','Zeugen verständigten die Einsatzkräfte; Unfallopfer mit dem Rettungswagen ins Krankenhaus'],['Folgen?','Muammar I. nur leicht verletzt; Blechschaden am PKW']],
 keys:[{f:'Wer? (Opfer)',h:'Muammar I. (13)',w:['Muammar','13-jährig','13-Jährig','Schüler']},{f:'Wer? (Lenkerin)',h:'Madlen M. (35)',w:['Madlen','Lenkerin','35-J','Fahrerin']},{f:'Wo?',h:'Brechtstraße, St. Johann',w:['Brechtstraße','Brechtstrasse','St. Johann']},{f:'Wann?',h:'Donnerstag, 21. Juni, 13:30',w:['Donnerstag','21. Juni','13:30','13.30']},{f:'Was / Wie?',h:'PKW erfasst Fußgänger',w:['erfasst','kollid','Motorhaube','angefahren','Zusammenstoß']},{f:'Hilfe?',h:'Rettungswagen, Krankenhaus',w:['Rettung','Krankenhaus','Einsatzkräfte','Sanitäter']},{f:'Folgen?',h:'leicht verletzt, Blechschaden',w:['leicht verletzt','leichte Verletzung','Blechschaden','Sachschaden']}],
 model:{headline:'13-Jähriger auf dem Heimweg von Auto erfasst',summary:'St. Johann im Pongau. Am Donnerstag, dem 21. Juni, wurde ein 13-jähriger Schüler auf dem Heimweg von der Schule von einem PKW erfasst und leicht verletzt.',hergang:'Gegen 13:30 Uhr war Muammar I. (13) in der Brechtstraße zu Fuß unterwegs. Als er die Fahrbahn betrat, näherte sich gerade der PKW von Madlen M. (35). Die Lenkerin bremste sofort, konnte ihr Fahrzeug aber nicht mehr rechtzeitig anhalten. Der Wagen kollidierte mit dem Schüler, der dabei auf die Motorhaube geschleudert wurde.',einsatz:'Mehrere Augenzeugen verständigten umgehend die Einsatzkräfte. Die Sanitäter versorgten den Buben noch an der Unfallstelle und brachten ihn anschließend mit dem Rettungswagen ins Krankenhaus. Kurz darauf traf auch eine Polizeistreife ein und sicherte die Unfallstelle ab.',folgen:'Laut den Ärzten erlitt der 13-Jährige nur leichte Verletzungen. Am PKW der 35-Jährigen entstand Blechschaden. Die Brechtstraße war während der Unfallaufnahme kurzzeitig gesperrt. Die Polizei klärt nun den genauen Unfallhergang.'}},
{id:'handymast',title:'Jugendliche auf Handymast',de:'Aus Zeugenaussagen',type:'zeugen',ort:'Wiener Neustadt',
 wit:[{who:'Samira L. (14), die Jugendliche',text:'„Am Freitag, dem 24. Oktober, wollte ich mit meinen Freundinnen spannende Videos machen. Ich bin auf den Handymast geklettert, um den Sonnenuntergang zu filmen. Oben ist mir plötzlich schwindelig geworden. Meine Freundinnen haben dann die Feuerwehr gerufen. Nach einer Viertelstunde war ich wieder unten.“'},{who:'Hendrik G., Feuerwehrkommandant',text:'„Die Zentrale hat uns am Freitagabend alarmiert, weil in der Austraße eine Jugendliche von einem Handymast geholt werden musste. Das Mädchen war völlig in Panik. Wir haben sie mit der Drehleiter sicher heruntergeholt.“'},{who:'Dilara K., Polizeibeamtin',text:'„Es ist streng verboten und lebensgefährlich, auf Handymasten zu klettern. Zum Glück wurde niemand verletzt. Die Eltern müssen die Kosten für den Einsatz übernehmen.“'}],
 keys:[{f:'Wer?',h:'Samira L. (14)',w:['Samira','14-J','Jugendliche','Schülerin','Mädchen']},{f:'Wo?',h:'Austraße, Wiener Neustadt',w:['Wiener Neustadt','Austraße']},{f:'Wann?',h:'Freitag, 24. Oktober',w:['24. Oktober','Freitag']},{f:'Was?',h:'auf Handymast geklettert',w:['Handymast','Funkmast','Mast']},{f:'Warum?',h:'Sonnenuntergang filmen, schwindelig',w:['Sonnenuntergang','filmen','schwindel']},{f:'Hilfe?',h:'Feuerwehr mit Drehleiter',w:['Drehleiter']},{f:'Folgen?',h:'unverletzt, Eltern zahlen, verboten',w:['unverletzt','niemand verletzt','Kosten','verboten']}],
 model:{headline:'14-Jährige mit Drehleiter von Handymast geholt',summary:'Wiener Neustadt. Am Freitag, dem 24. Oktober, musste die Feuerwehr in der Austraße eine 14-Jährige von einem Handymast holen.',hergang:'Samira L. wollte gemeinsam mit ihren Freundinnen den Sonnenuntergang mit dem Handy filmen. Für eine bessere Aussicht kletterte die Schülerin auf einen Handymast. Als sie oben nach unten blickte, wurde ihr plötzlich schwindelig, und sie traute sich nicht mehr hinunter. Ihre Freundinnen, die von unten zugesehen hatten, verständigten daraufhin die Einsatzkräfte.',einsatz:'Die Zentrale schickte daraufhin mehrere Fahrzeuge in die Austraße. Laut Kommandant Hendrik G. sei die Jugendliche bei der Ankunft der Feuerwehr völlig in Panik gewesen. Mithilfe der Drehleiter brachten die Feuerwehrleute sie nach rund einer Viertelstunde sicher zu Boden.',folgen:'Die 14-Jährige blieb unverletzt. Wie Polizeibeamtin Dilara K. betonte, sei das Klettern auf Handymasten streng verboten und lebensgefährlich. Die Kosten für den Einsatz müssen die Eltern tragen. Die Polizei warnt eindringlich vor solchen gefährlichen Mutproben.'}},
{id:'radweg',title:'Zusammenstoß auf dem Radweg',de:'Radfahrerin gestürzt',type:'fakten',ort:'Wels',
 facts:[['Was?','Zusammenstoß zweier Radfahrer'],['Wer?','Schülerin Lena F. (12 J.) mit dem Fahrrad; E-Bike-Fahrer Herbert K. (58 J.)'],['Wo?','Traunradweg bei Wels'],['Wann?','Samstag, 14. September, gegen 10:15 Uhr'],['Wie/Warum?','E-Bike-Fahrer überholte mit hoher Geschwindigkeit und zu knapp; die Lenker der Räder berührten sich; Lena stürzte in die Böschung; sie trug einen Helm'],['Hilfe?','Eine Spaziergängerin leistete Erste Hilfe und rief die Rettung; Rettung brachte Lena ins Klinikum Wels'],['Folgen?','Lena: gebrochenes Handgelenk, Schürfwunden; Herbert K. unverletzt; Polizei: beim Überholen Abstand halten']],
 keys:[{f:'Wer? (Schülerin)',h:'Lena F. (12)',w:['Lena','12-J','Schülerin','Radfahrerin']},{f:'Wer? (E-Bike)',h:'Herbert K. (58)',w:['Herbert','58-J','E-Bike']},{f:'Wo?',h:'Traunradweg bei Wels',w:['Traunradweg','Radweg']},{f:'Wann?',h:'Samstag, 14. September, 10:15',w:['Samstag','14. September','10:15','10.15']},{f:'Wie/Warum?',h:'zu knapp überholt, Sturz in Böschung',w:['überhol','Böschung','Abstand']},{f:'Hilfe?',h:'Spaziergängerin, Rettung',w:['Spaziergängerin','Erste Hilfe','Rettung','Klinikum']},{f:'Folgen?',h:'Handgelenk gebrochen, Schürfwunden',w:['Handgelenk','Schürfwunde','gebrochen','Bruch']}],
 model:{headline:'Radfahrerin nach Überholmanöver gestürzt',summary:'Wels. Am Samstag, dem 14. September, stießen auf dem Traunradweg zwei Radfahrer zusammen. Eine 12-jährige Schülerin wurde dabei verletzt.',hergang:'Gegen 10:15 Uhr war Lena F. (12) mit ihrem Fahrrad Richtung Stadtzentrum unterwegs. Zur selben Zeit näherte sich von hinten der E-Bike-Fahrer Herbert K. (58) mit hoher Geschwindigkeit. Beim Überholen hielt der 58-Jährige zu wenig Abstand, sodass sich die Lenker der beiden Räder berührten. Die Schülerin verlor das Gleichgewicht und stürzte in die Böschung.',einsatz:'Eine Spaziergängerin leistete sofort Erste Hilfe und verständigte die Rettung. Herbert K. hielt ebenfalls an und wartete auf die Polizei. Die Sanitäter brachten das Mädchen ins Klinikum Wels.',folgen:'Die 12-Jährige erlitt einen Bruch des Handgelenks sowie Schürfwunden. Ihr Fahrradhelm verhinderte Kopfverletzungen. Der E-Bike-Fahrer blieb unverletzt. Gegen den 58-Jährigen wird nun wegen fahrlässiger Körperverletzung ermittelt. Die Polizei appelliert an alle Radfahrer, beim Überholen ausreichend Abstand zu halten.'}},
{id:'kuechenbrand',title:'Küchenbrand in Graz',de:'Nachbar hilft',type:'fakten',ort:'Graz',
 facts:[['Was?','Küchenbrand in einem Mehrparteienhaus'],['Wer?','Pensionistin Gertrude H. (79 J.); Nachbar Lukas P. (16 J.)'],['Wo?','Annenstraße, Graz, Wohnung im 3. Stock'],['Wann?','Dienstag, 3. Dezember, gegen 18:45 Uhr'],['Wie/Warum?','Pfanne mit heißem Öl auf dem Herd vergessen; Öl fing Feuer; Rauchmelder schlug Alarm'],['Hilfe?','Lukas P. hörte den Rauchmelder, läutete, half der Frau aus der Wohnung, rief die Feuerwehr; Feuerwehr mit 4 Fahrzeugen und 25 Einsatzkräften; Brand nach 20 Minuten gelöscht'],['Folgen?','leichte Rauchgasvergiftung, zur Beobachtung ins Krankenhaus; Küche völlig zerstört; Wohnung derzeit unbewohnbar']],
 keys:[{f:'Wer? (Bewohnerin)',h:'Gertrude H. (79)',w:['Gertrude','79-J','Pensionistin']},{f:'Wer? (Nachbar)',h:'Lukas P. (16)',w:['Lukas','16-J','Nachbar']},{f:'Wo?',h:'Annenstraße, Graz',w:['Annenstraße','Graz']},{f:'Wann?',h:'Dienstag, 3. Dezember, 18:45',w:['Dienstag','3. Dezember','18:45','18.45']},{f:'Wie/Warum?',h:'Pfanne mit Öl vergessen',w:['Pfanne','Öl','Herd']},{f:'Hilfe?',h:'Feuerwehr, 4 Fahrzeuge, 25 Einsatzkräfte',w:['Feuerwehr','gelöscht','Einsatzkräfte']},{f:'Folgen?',h:'Rauchgasvergiftung, Küche zerstört',w:['Rauchgas','zerstört','unbewohnbar','ausgebrannt','brannte völlig aus']}],
 model:{headline:'Nachbar rettet Pensionistin aus verrauchter Wohnung',summary:'Graz. Bei einem Küchenbrand in der Annenstraße wurde am Dienstag, dem 3. Dezember, eine 79-jährige Frau leicht verletzt.',hergang:'Gegen 18:45 Uhr vergaß Gertrude H. (79) eine Pfanne mit heißem Öl auf dem Herd. Das Öl fing Feuer, und die Flammen griffen rasch auf die Küche im dritten Stock über. Kurz darauf schlug der Rauchmelder Alarm. Die Pensionistin bemerkte das Feuer erst, als dichter Rauch durch alle Räume zog.',einsatz:'Der 16-jährige Nachbar Lukas P. hörte das Piepsen, läutete an der Tür und half der Pensionistin aus der verrauchten Wohnung. Anschließend verständigte er die Feuerwehr. Diese rückte mit vier Fahrzeugen und 25 Einsatzkräften aus und löschte den Brand innerhalb von rund 20 Minuten. Die übrigen Hausbewohner mussten das Gebäude vorübergehend verlassen.',folgen:'Die 79-Jährige erlitt eine leichte Rauchgasvergiftung und wurde zur Beobachtung ins Krankenhaus gebracht. Die Küche brannte völlig aus. Die Wohnung ist derzeit unbewohnbar, die genaue Schadenshöhe ist noch unklar.'}},
{id:'bergrettung',title:'Wanderer im Nebel verirrt',de:'Aus Zeugenaussagen',type:'zeugen',ort:'Puchberg am Schneeberg',
 wit:[{who:'Thomas B. (42), Wanderer aus Wien',text:'„Am Sonntag, dem 12. Oktober, bin ich gegen 9 Uhr allein von Puchberg aus losgegangen. Am Nachmittag ist plötzlich dichter Nebel aufgezogen, und ich habe den Weg nicht mehr gefunden. Mein Handy-Akku war fast leer. Ich habe gerade noch den Notruf wählen können.“'},{who:'Karin S., Einsatzleiterin der Bergrettung',text:'„Wir sind um 15:30 Uhr alarmiert worden und mit zwölf Bergrettern zu Fuß aufgestiegen. Wegen des Nebels konnte der Hubschrauber nicht fliegen. Um 18 Uhr haben wir den Mann unterhalb des Gipfels gefunden. Er war stark unterkühlt.“'},{who:'Maria W., Hüttenwirtin',text:'„Der Wanderer hat sich bei uns in der Hütte aufgewärmt. Ich rate allen: Schauen Sie vor jeder Tour auf den Wetterbericht!“'}],

 model:{headline:'Entlaufenes Pony sorgt für Stau auf der B1',summary:'Enns. Ein entlaufenes Pony legte am Montag, dem 7. April, den Frühverkehr auf der B1 zwischen Enns und Asten lahm.',hergang:'Gegen 7:20 Uhr bemerkten mehrere Autofahrer das Shetlandpony Flocke, das zwischen den Fahrzeugen auf der Bundesstraße trabte. Einige Lenker mussten stark abbremsen. Das Tier war von einer Weide des nahe gelegenen Reiterhofs entkommen, weil das Tor nicht richtig verschlossen war.',einsatz:'Einige Autofahrer verständigten über Notruf die Polizei. Zwei Streifen sperrten die Fahrbahn daraufhin kurzzeitig ab. Wenig später traf auch die Besitzerin Anna G. (31) ein. Mit einigen Karotten lockte sie das Tier von der Straße und brachte es anschließend zurück in den Stall.',folgen:'Durch den Vorfall bildete sich ein etwa 30 Minuten langer Stau. Verletzt wurde niemand, auch die Stute blieb unverletzt. Ein Sachschaden entstand nicht. Der Reiterhof will das Weidetor nun mit einem zusätzlichen Schloss sichern.'}},

 model:{headline:'Schulbus rutscht bei Glatteis in den Graben',summary:'Bad Leonfelden. Am Mittwoch, dem 15. Jänner, kam ein Schulbus mit 22 Kindern auf der eisigen Landesstraße ins Rutschen und landete im Straßengraben.',hergang:'Gegen 7:10 Uhr war Busfahrer Johann R. (52) mit den Schülerinnen und Schülern auf dem Weg zur Schule. Kurz vor dem Ortsgebiet geriet der Bus in einer Kurve auf Glatteis, da die Fahrbahn noch nicht gestreut war. Der Lenker konnte das Fahrzeug nicht mehr abfangen, sodass es schräg im Graben zum Stehen kam.',einsatz:'Der 52-Jährige setzte sofort einen Notruf ab. Über den Notausstieg verließen alle Kinder geordnet den Bus. Die örtliche Feuerwehr und vier Rettungswagen trafen wenig später ein. Die Sanitäter untersuchten die Schülerinnen und Schüler vorsorglich. Ein Ersatzbus brachte sie schließlich zur Schule.',folgen:'Verletzt wurde niemand. Die Feuerwehr barg den Bus mit einem Kran. Die Straße war dafür zwei Stunden lang gesperrt. Anschließend streute die Straßenmeisterei die Strecke erneut.'}},
{id:'eisteich',title:'Bub bricht im Eis ein',de:'Aus Zeugenaussagen',type:'zeugen',ort:'Wals-Siezenheim',

 ta.oninput=upd;hd.oninput=upd;upd();
 const iv=setInterval(()=>{const el=$('#tmr');if(!el){clearInterval(iv);return;}const sec=Math.floor((Date.now()-(r.start||Date.now()))/1000);el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');},1000);
 const show=()=>{const full=hd.value+'\n'+ta.value;const cur=curErrs(ai,full);$('#aiL').innerHTML=aiListHTML(cur);const iss=[];partsOf(r,3).forEach(p=>iss.push(...checkText(p.text,p.kind)));iss.push(...checkWhole(ta.value));$('#fb').innerHTML=fbHTML(iss.filter(x=>x.lvl!=='ok').concat(iss.filter(x=>x.lvl==='ok').slice(0,3)));
  $('#pv').innerHTML=clipHTML(hd.value,ta.value.split(/\n+/),findRepeats(ta.value),cur);};
 if(ta.value.trim())show();
 $('#chk').onclick=async()=>{upd();show();const full=(hd.value.trim()?hd.value.trim()+'\n':'')+ta.value.trim();if(!ta.value.trim())return;const sm=await getSample();if(!sm||aiOff)return;const b=$('#chk');b.disabled=true;$('#aist').textContent='Claude prüft deinen Bericht …';
  try{ai.errs=await aiCheck(t,'ganzer Bericht (erste Zeile = Headline)',full);ai.text=full;save();if(document.body.contains(b)){$('#aist').textContent=ai.errs.length?`Claude hat ${ai.errs.length} Fehler markiert (rot unterstrichen).`:'✓ Claude hat keine Fehler gefunden.';show();}}catch(e){if(document.body.contains(b))$('#aist').textContent=aiErrMsg(e);}if(document.body.contains(b))b.disabled=false;};
 $('#quit').onclick=quitRound;
 $('#done').onclick=async()=>{upd();if(wc(ta.value)<60&&!await ask('Dein Bericht ist noch sehr kurz. Wirklich fertig?','Ja, auswerten','Weiterschreiben'))return;if(!hd.value.trim()&&!await ask('Die Headline fehlt noch!','Trotzdem auswerten','Headline schreiben'))return;finishReport();};}

/* ===================== AUSWERTUNG ===================== */
function headOf(r,lvl){return lvl===3?(r.fhead||''):(r.a.headline||'');}
function bodyParas(r,lvl){return (lvl===3?String(r.free||'').split(/\n+/):paraOf(r)).map(x=>x.trim()).filter(Boolean);}
function partsOf(r,lvl){if(lvl===3){const ps=bodyParas(r,3);return [{k:'headline',kind:'headline',text:r.fhead||''},...ps.map((p,i)=>({k:'p'+i,kind:i===0?'summary':'body',text:p}))];}
 return STEPS.map(s=>({k:s.k,kind:s.kind,text:r.a[s.k]||''}));}
function allAiErrs(r,lvl){if(lvl===3)return curErrs(r.ai.free,(r.fhead||'')+'\n'+(r.free||''));return STEPS.flatMap(s=>curErrs(r.ai[s.k],r.a[s.k]||''));}
const SPR=['Rechtschreibung','Grammatik','Zeichensetzung','Satzbau','Großschreibung','Zeitform'];const STY=['Berichtsstil','Sachlichkeit','Wörtliche Rede','Ausdruck'];
function evaluate(t,r,lvl){const head=headOf(r,lvl);const paras=bodyParas(r,lvl);const body=paras.join('\n');const parts=partsOf(r,lvl);
 const issues=[];parts.forEach(p=>issues.push(...checkText(p.text,p.kind)));issues.push(...checkWhole(body));
 const wq=wCheck(t,head+'\n'+body);const n=wc(body);const aiE=allAiErrs(r,lvl);
 const inhalt=Math.round(25*wq.filter(x=>x.ok).length/wq.length);
 let auf=0;const ht=head.trim();if(ht)auf+=(wc(ht)<=10&&!/[.!]\s*$/.test(ht))?5:3;
 const sum=parts.find(p=>p.kind==='summary');if(sum&&sum.text.trim()){const ss=splitSentences(sum.text);auf+=(wc(ss[0]||'')<=4?2:0)+(wc(sum.text)<=50?3:1);}
 const story=parts.filter(p=>p.kind==='body'&&wc(p.text)>=12).length;auf+=lvl===3?(story>=2?5:story?3:0):Math.round(5*Math.min(3,story)/3);
 const len=n>=W[0]&&n<=W[1]?10:(n>=110&&n<=200?5:0);
 const bad=issues.filter(x=>x.lvl==='bad'),warn=issues.filter(x=>x.lvl==='warn');
 const cnt=(arr,cats)=>arr.filter(x=>cats.includes(x.cat)).length;
 const sprache=Math.max(0,Math.round(25-3*cnt(bad,SPR)-1.5*cnt(warn,SPR)-2*aiE.filter(e=>!/Berichtsstil|Ausdruck/.test(e.art)).length));
 const stil=Math.max(0,Math.round(15-5*cnt(bad,STY)-2*cnt(warn,STY)-2*aiE.filter(e=>/Berichtsstil|Ausdruck/.test(e.art)).length));
 const reps=findRepeats(body);const conn=CONN.filter(p=>wre(p).test(body)).length;const ber=BERICHT.filter(p=>wre(p).test(body)).length;
 const abw=Math.max(0,Math.min(10,Math.min(5,conn*2)+Math.min(5,ber))-2*reps.length-2*startRepeats(body).length);
 const fl=Math.min(1,n/W[0]);const sprF=Math.round(sprache*fl),stilF=Math.round(stil*fl),abwF=Math.round(abw*fl);
 const cats={};[...bad,...warn].forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);aiE.forEach(e=>{const k=e.art||'Grammatik';cats[k]=(cats[k]||0)+1;});
 return {total:inhalt+auf+len+sprF+stilF+abwF,parts:[['W-Fragen',inhalt,25],['Aufbau',auf,15],['Länge',len,10],['Sprache',sprF,25],['Berichtsstil',stilF,15],['Abwechslung',abwF,10]],n,issues,wq,reps,aiE,cats,head,paras,body};}
function finishReport(){const c=S.cur,r=c.reps[c.i],t=T(r.t);const ev=evaluate(t,r,c.level);r.saved={s:ev.total,c:ev.cats,x:ev.head.trim()+'\n'+ev.paras.join('\n'),parts:ev.parts};c.phase='result';save();window.scrollTo({top:0});viewReport();}
function finalPrompt(t,head,body){return `${BASE}
Bewerte diesen Zeitungsbericht einer Schülerin / eines Schülers (Ziel: etwa 150 Wörter).
Thema: ${t.title}. ${t.type==='zeugen'?'Grundlage waren Zeugenaussagen; sie sollen ohne wörtliche Rede wiedergegeben werden.':''}
Wichtige Fakten: ${t.keys.map(k=>k.f+' '+k.h).join(' | ')}
Headline: """${head}"""
Bericht:
"""${body}"""
Antworte NUR mit JSON, ohne Markdown:
{"lob":"1–2 Sätze auf Deutsch, was gut gelungen ist","aufbau":"1 Satz zu Headline, Summary und Story","fehler":[{"original":"wörtlich kopierter, kurzer Ausschnitt (1–6 Wörter)","korrektur":"richtige Form","art":"${ART}","erklaerung":"kurz und kindgerecht"}],"wiederholungen":[{"wort":"wiederholtes Wort","alternativen":["2–4 passende Ersatzwörter oder Umformulierungen"]}],"tipps":["höchstens 3 konkrete Tipps mit Beispiel"],"verbessert":"der verbesserte Bericht: erste Zeile Headline, dann Absätze; Inhalt und Ideen der Schülerin behalten, nur Fehler und Stil verbessern"}
Höchstens 10 Fehler, die wichtigsten zuerst. Erfinde keine Fehler.`;}
function viewReport(){rerender=viewReport;const c=S.cur,r=c.reps[c.i],t=T(r.t);const ev=evaluate(t,r,c.level);const sv=r.saved||{s:ev.total,c:ev.cats,parts:ev.parts};
 const stars='★'.repeat(Math.round(sv.s/20))+'☆'.repeat(5-Math.round(sv.s/20));const mins=r.start?Math.round((Date.now()-r.start)/60000):null;const m=t.model;
 const top=Object.entries(sv.c||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
 app.innerHTML=`${header()}<h2>Auswertung Bericht ${c.i+1}: ${esc(t.title)}</h2>
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${sv.s}</div><div class="note">von 100 Punkten · ${stars}</div></div><div class="note" style="text-align:right">${ev.n} Wörter (Ziel ${W[0]}–${W[1]})</div></div>
 <div class="bars" style="margin-top:14px">${(sv.parts||ev.parts).map(([n,v,mx])=>`<span>${n}</span><span class="b"><i style="width:${v/mx*100}%"></i></span><span>${v}/${mx}</span>`).join('')}</div></div>
 <div class="card"><h3>Dein Bericht</h3>${clipHTML(ev.head,ev.paras,ev.reps,ev.aiE)}<p class="note" style="margin:8px 0 0">Farbig: Wiederholungen · rot unterstrichen: Fehler</p></div>
 <div class="card"><h3>W-Fragen</h3>${ev.wq.map(w=>`<div class="f ${w.ok?'ok':'warn'}" style="margin:4px 0">${w.ok?'✓':'!'} <b>${esc(w.f)}</b>${w.ok?'':` fehlt – z. B.: <i>${esc(w.h)}</i>`}</div>`).join('')}</div>
 <div class="card"><h3>Was du verbessern kannst</h3><div class="fb">${aiListHTML(ev.aiE)}${fbHTML(ev.issues.filter(x=>x.lvl!=='ok'))||(!ev.aiE.length?'<div class="f ok">✓ Keine Fehler gefunden – sehr gut!</div>':'')}</div><p class="note">Die Sofort-Kontrolle findet typische Fehler, aber nicht alle. Lies deinen Text immer noch einmal selbst durch.</p></div>
 <div class="card hidden" id="ai"><h3>Feedback von Claude</h3><div id="aiout"><p class="note">Claude liest deinen ganzen Bericht …</p></div></div>
 <details class="card"><summary><b>Musterbericht ansehen</b> <span class="note">– vergleiche: Was hat der Musterbericht, was dir noch fehlt?</span></summary><div style="margin-top:10px">${clipHTML(m.headline,[m.summary,m.hergang,m.einsatz,m.folgen],[],[],false)}</div></details>
 <div class="card"><h3>Zusammenfassung</h3>${top.length?`<p>Achte beim nächsten Bericht besonders auf: ${top.map(([k,v])=>`<b>${esc(k)}</b> (${v}×)`).join(', ')}.</p>`:'<p>Dieser Bericht war sprachlich sehr sauber!</p>'}
 ${mins!==null&&c.level===3?`<p class="note">Schreibzeit: etwa ${mins} Minuten${mins>25?' – bei der Schularbeit musst du zwei Berichte schaffen. Übe, schneller zu werden!':'.'}</p>`:''}
 <p>Schreib den <b>verbesserten Bericht ins Heft</b> – mit allen Korrekturen.</p>
 <div class="row"><button class="btn" id="nx">${c.i===0?'Weiter zu Bericht 2':'Zur Rundenauswertung'}</button></div></div>`;
 $('#nx').onclick=()=>{if(c.i===0){c.i=1;c.phase='intro';save();window.scrollTo({top:0});viewIntro();}else endRound();};
 runFinal(t,r,ev);}
async function runFinal(t,r,ev){const sm=await getSample();if(!sm||aiOff)return;const box=$('#ai');if(!box)return;box.classList.remove('hidden');const out=$('#aiout');
 const key=ev.head+'\n'+ev.body;if(r.fin&&r.fin.key===key)return showFinal(r.fin.data);
 try{const d=await sm.json(finalPrompt(t,ev.head,ev.paras.join('\n\n')));r.fin={key,data:d};save();if(document.body.contains(out))showFinal(d);}
 catch(e){if(e&&e.code==='not_granted'){aiOff=true;box.classList.add('hidden');return;}if(document.body.contains(out)){out.innerHTML=`<div class="f warn">${aiErrMsg(e)}</div><div class="row" style="margin-top:8px"><button class="btn s sm" id="aiR">Nochmal versuchen</button></div>`;$('#aiR').onclick=()=>{out.innerHTML='<p class="note">Claude liest deinen ganzen Bericht …</p>';runFinal(t,r,ev);};}}}
function showFinal(d){const out=$('#aiout');if(!out||!d)return;const errs=normErrs(d.fehler);const reps=Array.isArray(d.wiederholungen)?d.wiederholungen:[];const tips=Array.isArray(d.tipps)?d.tipps:[];
 out.innerHTML=`${d.lob?`<div class="f ok">✓ ${esc(d.lob)}</div>`:''}${d.aufbau?`<p style="margin:10px 0 0"><b>Aufbau:</b> ${esc(d.aufbau)}</p>`:''}
 ${errs.length?`<h3 style="margin-top:12px">Fehler</h3><div class="fb">${aiListHTML(errs)}</div>`:''}
 ${reps.length?`<h3 style="margin-top:12px">Wortwiederholungen – so geht es abwechslungsreicher</h3><div class="fb">${reps.map(w=>`<div class="f warn">! <b>${esc(w.wort)}</b> → ${(Array.isArray(w.alternativen)?w.alternativen:[]).map(esc).join(', ')}</div>`).join('')}</div>`:''}
 ${tips.length?`<h3 style="margin-top:12px">Tipps</h3><ul>${tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 ${d.verbessert?`<h3 style="margin-top:12px">Verbesserte Version</h3>${(()=>{const ls=String(d.verbessert).split(/\n+/).map(x=>x.trim()).filter(Boolean);return clipHTML(ls[0]||'',ls.slice(1),[],[],false);})()}`:''}`;}
function endRound(){const c=S.cur;const scores=c.reps.map(r=>r.saved?r.saved.s:0);const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);const Q=c.quiz;const lvlBefore=c.level;
 S.hist.push({d:Math.floor(Date.now()/864e5),l:lvlBefore,hp:c.help?1:0,q:[Q.ans.filter(Boolean).length,Q.ids.length],s:avg,r:c.reps.map(r=>({t:r.t,s:r.saved?r.saved.s:0,c:r.saved?r.saved.c:{},x:r.saved?r.saved.x:''}))});
 c.lvlMsg='';if(avg>=75&&S.level<3&&S.level===lvlBefore){S.level++;c.lvlMsg=`<div class="f ok">🎉 Super! Du steigst auf <b>Stufe ${S.level}</b> auf: ${LEVELS[S.level].split('– ')[1]}.</div>`;}
 else if(avg<50&&lvlBefore>1)c.lvlMsg=`<div class="f warn">Tipp: Probier die nächste Runde noch einmal auf <b>Stufe ${lvlBefore-1}</b> (auf der Startseite einstellbar).</div>`;
 c.phase='round';save();window.scrollTo({top:0});viewRound();}
function viewRound(){rerender=viewRound;const c=S.cur;const h=S.hist[S.hist.length-1];const prev=S.hist.length>1?S.hist[S.hist.length-2]:null;
 const agg={};h.r.forEach(r=>Object.entries(r.c||{}).forEach(([k,v])=>agg[k]=(agg[k]||0)+v));const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,3);
 app.innerHTML=`${header()}<h2>Rundenauswertung</h2>
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${h.s}</div><div class="note">Durchschnitt von 100 Punkten</div></div><div class="note" style="text-align:right">${prev?`${h.s-prev.s>=0?'▲ +':'▼ '}${h.s-prev.s} zur letzten Runde`:'Erste Runde'}</div></div>
 <div class="tablewrap" style="margin-top:12px"><table><tr><th>Teil</th><th>Ergebnis</th></tr><tr><td>Regel-Check</td><td><b>${h.q[0]} / ${h.q[1]}</b> richtig</td></tr>${h.r.map((r,j)=>`<tr><td>Bericht ${j+1}: ${esc(T(r.t).title)}</td><td><b>${r.s}</b> Punkte</td></tr>`).join('')}</table></div>${c.lvlMsg?`<div style="margin-top:12px">${c.lvlMsg}</div>`:''}</div>
 <div class="card"><h3>Zusammenfassung</h3>${top.length?`<p>In dieser Runde kamen diese Fehlerarten am häufigsten vor: ${top.map(([k,v])=>`<b>${esc(k)}</b> (${v}×)`).join(', ')}. Darauf achtest du in der nächsten Runde besonders.</p>`:'<p>Beide Berichte waren sprachlich sehr sauber!</p>'}
 <p>Schreib <b>beide verbesserten Berichte ins Heft</b>.</p><div class="row"><button class="btn" id="again">Nächste Runde</button></div></div>${merkbox()}`;
 $('#again').onclick=()=>{S.cur=null;save();window.scrollTo({top:0});viewHome();};}

/* Start */
if(!S.name)viewStart();else if(S.cur)route();else viewHome();
</script>
</body>
