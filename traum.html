<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essensplan</title>
<meta name="theme-color" content="#3F7F34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --ink:#22261F; --muted:#626B5D; --line:#D9DED2; --soft:#ECF0E6;
  --protein:#3F7F34; --protein-soft:#E1EEDC; --kcal:#C9711E; --fiber:#86507A; --rim:#E7EBE1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131611; --surface:#1C211A; --ink:#E9EDE5; --muted:#A1AA9B; --line:#2E362B; --soft:#232A20;
    --protein:#77BE66; --protein-soft:#24361F; --kcal:#E9994F; --fiber:#C58AB8; --rim:#2A3227;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131611; --surface:#1C211A; --ink:#E9EDE5; --muted:#A1AA9B; --line:#2E362B; --soft:#232A20;
  --protein:#77BE66; --protein-soft:#24361F; --kcal:#E9994F; --fiber:#C58AB8; --rim:#2A3227;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
h1{font-size:2.3rem;line-height:1.02;margin:0}
h2{font-size:1.5rem;margin:26px 0 10px;line-height:1.15}
[hidden]{display:none!important}
a{color:var(--ink);text-decoration-color:var(--protein);text-decoration-thickness:2px;text-underline-offset:3px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--kcal);outline-offset:2px}

.gate{padding-top:8vh}
.gate p{color:var(--muted);margin:12px 0 20px}
.gate-form{display:flex;flex-direction:column;gap:10px}
.gate-form label{font-weight:600}
.field{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;width:100%}
.btn{min-height:46px;border-radius:10px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:0 16px}
.btn.primary{background:var(--protein);border-color:var(--protein);color:#fff}
.known-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--muted)}
.who strong{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--protein);font-weight:600;cursor:pointer;padding:6px 0}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:16px 0 4px}
.tabs button{border:0;background:none;border-radius:9px;min-height:40px;cursor:pointer;font-weight:600;color:var(--muted);font-size:.86rem;padding:0 2px}
.optrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list .optrow:first-child{border-top:0}
.optrow input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--protein)}
.optrow .vals{color:var(--muted);font-size:.9rem}
.result{background:var(--protein-soft);border:1px solid var(--protein);border-radius:14px;padding:14px 16px;margin:16px 0 8px}
.result .vals{color:var(--ink);font-size:.92rem;margin-top:4px}
textarea.field{font:inherit;resize:vertical}
.searchrow{display:flex;gap:8px}
.searchrow .field{flex:1}
.calcdet{margin-top:10px}
.calcdet summary{cursor:pointer;color:var(--protein);font-weight:600}
.calclist{list-style:none;margin:8px 0 0;padding:0;font-size:.92rem}
.calclist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:6px 0;border-top:1px solid var(--line)}
.srcpick{margin:10px 0}
.portbox{border:2px solid var(--kcal);border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--surface)}
.portbig{font-family:"Bricolage Grotesque",sans-serif;margin:4px 0 6px}
.portbig span{font-size:2.2rem;font-weight:700;line-height:1}
.portbig small{color:var(--muted);font-size:1rem}
.barbell{margin:14px 0 4px}.barbell svg{width:100%;height:auto;display:block}
.tscore{text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;margin:2px 0 14px}
.tscore small{display:block;font-family:"Source Sans 3",sans-serif;font-size:.95rem;color:var(--muted)}
.tdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
.tday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 2px 9px;text-align:center;min-width:0}
.tday .dn{font-weight:600;font-size:.85rem}.tday .dd{color:var(--muted);font-size:.78rem}
.tday .mark{margin:5px auto 0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.tday .mark.planned{border:2px dashed var(--line);color:var(--muted)}
.tday .mark.done{background:var(--protein);color:#fff}
.tday .mark.rest{color:var(--muted);font-weight:400}
.tday.is-today{border-color:var(--ink);border-width:2px}
.tunit{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.tunit.complete{border-color:var(--protein)}
.tunit-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.tunit-head .tag{flex:none;width:40px;height:40px;border-radius:50%;background:var(--kcal);color:#fff;display:grid;place-items:center;font-weight:700}
.tunit.complete .tunit-head .tag{background:var(--protein)}
.tunit-head .t{flex:1;min-width:0}.tunit-head .t strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.tunit-head .t span{color:var(--muted);font-size:.9rem}
.tunit-head .count,.tunit-head .chev{flex:none;color:var(--muted)}
.tunit.open .chev{transform:rotate(180deg)}
.tunit-body{display:none;padding:0 16px 14px}.tunit.open .tunit-body{display:block}
.tsteps{list-style:none;margin:0;padding:0}
.tstep{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tstep input{flex:none;width:26px;height:26px;margin-top:2px;accent-color:var(--protein)}
.tstep .s{flex:1;min-width:0}.tstep .role{font-size:.85rem;color:var(--muted)}
.tstep a{font-weight:600;overflow-wrap:anywhere}.tstep.checked a{color:var(--muted)}
.tstep .min{flex:none;color:var(--muted);font-size:.9rem}
.sweetadd{display:grid;grid-template-columns:1fr 6.5em auto;gap:6px}
.altsel{width:100%;margin-top:6px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;padding:0 8px}
.qtyrow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.qbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.1rem;flex:none}
.qin{width:5.5em;min-height:44px;font-size:1.15rem!important;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.qsel{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 6px;max-width:11em}
.calclist li.omitted .nm,.calclist li.omitted>.vals{text-decoration:line-through;color:var(--muted)}
.omitctl{width:100%;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.drain{color:var(--muted);font-size:.88rem;display:inline-flex;gap:4px;align-items:center}
.pot{font-weight:600;color:var(--kcal);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}

.daynav{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.daynav button.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;cursor:pointer;flex:none}
.daynav .label{flex:1;text-align:center}
.daynav .label strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.daynav .label span{color:var(--muted);font-size:.95rem}

.plate{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;margin:14px 0 20px}
.plate svg{width:180px;height:180px;display:block}
.meters{display:flex;flex-direction:column;gap:12px}
.meter .top{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.meter .top strong{font-variant-numeric:tabular-nums}
.meter .track{height:10px;border-radius:5px;background:var(--rim);overflow:hidden;margin-top:4px}
.meter .fill{height:100%;border-radius:5px}
.meter .goal{color:var(--muted);font-size:.82rem}
@media (max-width:440px){.plate{grid-template-columns:1fr;justify-items:center}.meters{width:100%}}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin-bottom:12px}
.meal h3{margin:0 0 8px;font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal h3 .pe{font-family:"Source Sans 3",sans-serif;font-size:.95rem;color:var(--protein);font-weight:600;font-variant-numeric:tabular-nums}
.meal select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 10px;width:100%}
.rinfo{margin-top:10px;font-size:.95rem}
.rinfo .vals{color:var(--muted)}
.rinfo .hint{margin-top:4px}
.portion{display:flex;align-items:center;gap:10px;margin-top:10px}
.portion button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.2rem}
.portion span{min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.chips-cap{margin:12px 0 6px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--protein-soft);border-color:var(--protein);color:var(--ink);font-weight:600}
.sum{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.95rem}
.sum strong{color:var(--protein)}
.meal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meal-actions .btn{min-height:40px;font-size:.92rem}
.flash{color:var(--protein);font-size:.9rem;min-height:1.2em;margin-top:6px}

.week-row{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.week-row:last-child{border-bottom:1px solid var(--line)}
.week-row .d{font-weight:600}
.week-row .d small{display:block;color:var(--muted);font-weight:400}
.week-row .m{font-size:.9rem;color:var(--muted);min-width:0}
.week-row .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-row .p{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.week-row .p small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.week-row.today .d{color:var(--protein)}
.prep{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.prep li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.prep li:first-child{border-top:0}
.prep ul{list-style:none;margin:0;padding:0}
.prep .n{font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.empty{color:var(--muted)}

.recipe{padding:12px 0;border-top:1px solid var(--line)}
.recipe:first-of-type{border-top:0}
.recipe .vals{color:var(--muted);font-size:.92rem}
.recipe .hint{font-size:.92rem}
.addform{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.addform label{display:block;font-size:.9rem;font-weight:600;margin-bottom:4px}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.8em,1fr));gap:8px}
.restline{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.restcard{border-color:var(--protein)}
.field{font-size:1.05rem}
.addgrid.two{grid-template-columns:1fr 1fr}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}

.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.wform label{font-size:.9rem;font-weight:600;display:block;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.82rem;display:block}
#wchart{width:100%;height:auto;display:block}
.wlist{list-style:none;margin:12px 0 0;padding:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wlist button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;width:36px;height:36px}
.note{color:var(--muted);font-size:.9rem;margin-top:22px}
.sync{color:var(--muted);font-size:.85rem;text-align:center;margin-top:8px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="gate" class="gate" hidden>
    <h1>Essensplan</h1>
    <p>Gib deinen Namen ein. Dein Plan wird unter diesem Namen gespeichert.</p>
    <form id="gateForm" class="gate-form">
      <label for="nameInput">Dein Name</label>
      <input id="nameInput" class="field" type="text" autocomplete="given-name" maxlength="40" required>
      <button class="btn primary" type="submit">Los geht’s</button>
    </form>
    <div id="knownWrap" hidden>
      <p>Oder weiter als:</p>
      <div id="known" class="known-list"></div>
    </div>
  </section>

  <div id="app" hidden>
    <h1>Essensplan</h1>
    <div class="who">Plan von <strong id="whoName"></strong><button type="button" class="linkbtn" id="switch">Person wechseln</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-v="tag">Tag</button>
      <button role="tab" data-v="woche">Woche</button>
      <button role="tab" data-v="training">Training</button>
      <button role="tab" data-v="rezepte">Rezepte</button>
      <button role="tab" data-v="opt">Rechner</button>
      <button role="tab" data-v="gewicht">Gewicht</button>
    </div>

    <section id="v-tag"></section>
    <section id="v-woche" hidden></section>
    <section id="v-training" hidden></section>
    <section id="v-rezepte" hidden></section>
    <section id="v-opt" hidden></section>
    <section id="v-gewicht" hidden></section>

    <p class="note">Nährwerte sind Richtwerte. Die Sicherung für ein anderes Gerät findest du ganz unten im Tab „Gewicht“.</p>
    <div class="sync" id="sync"></div>
  </div>
</main>
<script>
(function(){
const BUILTIN = [];

const B = [

  {id:"thun", n:"Thunfisch natur, 1 Dose", kcal:140, e:30, b:0},
  {id:"eier2", n:"2 Eier", kcal:150, e:13, b:0},
  {id:"eiklar", n:"Eiklar 100 g", kcal:50, e:11, b:0},
  {id:"edamame", n:"Edamame 100 g", kcal:120, e:11, b:5},
  {id:"prot15", n:"Proteinpulver 15 g", kcal:58, e:12, b:0},
  {id:"prot30", n:"Proteinpulver 30 g", kcal:115, e:24, b:0},
  {id:"brot2", n:"2 Scheiben Vollkornbrot", kcal:200, e:7, b:6},
  {id:"linsennudel", n:"Linsennudeln 70 g", kcal:240, e:17, b:6},
  {id:"reis", n:"Vollkornreis 60 g roh", kcal:210, e:5, b:2},
  {id:"hafer", n:"Haferflocken 20 g", kcal:75, e:3, b:2},
  {id:"beeren", n:"Beeren 100 g", kcal:40, e:1, b:4}
];
let RBY = {};
function rebuild(){ Object.assign(T,T_DEF,state.targets||{}); R = baseList.concat((state.custom||[]).map(c=>Object.assign({custom:true},c))); RBY = Object.fromEntries(R.map(r=>[r.id,r])); }
let baseList = BUILTIN.slice();
const BBY = Object.fromEntries(B.map(b=>[b.id,b]));
const T_DEF = {kcalLow:1900, kcal:2100, eLow:135, e:150, b:30, perMeal:50, sweet:150};
const T = {...T_DEF};
/* ---------- Produkte ---------- */
const DEFAULT_PRODUCTS = [
  // Eiweiß – passt zu süß und herzhaft
  {id:"p_skyr", n:"Skyr natur", g:250, kcal:63, e:11, b:0, t:"sh", grp:"e"},

  {id:"p_milch", n:"Milch 1,5 %", g:250, kcal:47, e:3.4, b:0, t:"s", grp:"e"},
  {id:"p_soja", n:"Sojadrink", g:250, kcal:40, e:3.5, b:0.5, t:"s", grp:"e"},
  {id:"p_prot", n:"Proteinpulver", g:30, kcal:380, e:80, b:0, t:"s", grp:"e"},
  {id:"p_eiklar", n:"Eiklar flüssig", g:100, kcal:48, e:11, b:0, t:"sh", grp:"e"},
  {id:"p_eier", n:"Eier (2 Stück)", g:120, kcal:140, e:12.5, b:0, t:"sh", grp:"e"},
  // Eiweiß – herzhaft
  {id:"p_huhn", n:"Hühnerbrust roh", g:150, kcal:110, e:23, b:0, t:"h", grp:"e"},
  {id:"p_putestreifen", n:"Putenbrust roh", g:150, kcal:105, e:24, b:0, t:"h", grp:"e"},
  {id:"p_pute", n:"Putenbrust-Aufschnitt (Hofer)", g:100, kcal:105, e:22, b:0, t:"h", grp:"e"},

  {id:"p_fisch", n:"Fischfilet mager (z. B. Kabeljau)", g:150, kcal:85, e:18, b:0, t:"h", grp:"e"},
  {id:"p_schnitt", n:"Fettarmer Schnittkäse (Hofer)", g:30, kcal:260, e:30, b:0, t:"h", grp:"e"},
  {id:"p_mozz", n:"Mozzarella light", g:125, kcal:160, e:19, b:0, t:"h", grp:"e"},

function toGrams(n,u,k){
  u=u.toLowerCase().replace(".","");
  if(u==="kg"||u==="l") return n*1000;
  if(u==="g"||u==="ml") return n;
  if(u==="el") return n*(["oel","butter","ghee"].includes(k)?10:15);
  if(u==="tl") return n*5;
  if(u==="becher") return n*(k==="obers"?250:200);
  if(u==="dose"||u==="dosen") return n*400;
  return n*250;
}

function parseRecipeText(txt, name){
  const out={kcal:null,e:null,b:null,portions:null,items:[]};
  const t=txt.replace(/\u00a0/g," ");
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*kcal/i); if(m) out.kcal=num(m[1]);
  m=t.match(/(?:Eiwei(?:ß|ss)|Protein)\s*:?\s*(\d+(?:[.,]\d+)?)\s*g/i); if(m) out.e=num(m[1]);
  m=t.match(/(?:Ballaststoffe|Fibre|Fiber)\s*:?\s*(\d+(?:[.,]\d+)?)\s*g/i); if(m) out.b=num(m[1]);
  m=t.match(/(\d+)\s*(?:Portionen|portions|Personen)/i); if(m) out.portions=parseInt(m[1],10);
  const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const best={};
  lines.forEach((ln,i)=>{
    if(ln.length>90) return;
    if(name && ln.toLowerCase()===name.toLowerCase()) return;
    if(/kcal|kJ|Portion|Nährwert|Nutrition|Zubereitung|Bewertung|ratings|Gesamt|Total/i.test(ln)) return;
    const rule=SWAPS.find(r=>r.re.test(ln) && !(r.skip&&r.skip.test(ln)));
    if(!rule) return;
    let q=null, est=false;
    for(let j=i;j<=Math.min(i+2,lines.length-1);j++){
      if(j>i && SWAPS.some(r=>r.re.test(lines[j]))) break;
      const qm=lines[j].match(QTY); if(qm){ q=toGrams(num(qm[1]),qm[2],rule.k); break; }
    }
    if(q==null){ q=100; est=true; }
    const label=ln.replace(QTY,"").replace(/^[-•*\s]+/,"").trim();
    if(!best[rule.k] || q>best[rule.k].g) best[rule.k]={rule, g:q, est, label};
  });
  out.items=Object.values(best);
  return out;
}

function computeOpt(){
  const P=Math.max(1, num(opt.portions)||1);
  const base={kcal:num(opt.kcal)||0, e:num(opt.e)||0, b:num(opt.b)||0};
  const omL=omittedLabels();
  const swaps=(opt.items||[]).map((it,i)=>{
    if(omL.some(l=>l.includes(it.label.toLowerCase())||it.label.toLowerCase().includes(l.replace(QTY,"").trim()))) return null;
    const f=it.g/100/P;
    const al=altsOf(it.rule), ai=Math.min(opt.swapAlt&&opt.swapAlt[i]||0, al.length-1), A=al[ai];
    return {i, it, alts:al, ai, to:A[0], dk:A[1]*f, de:A[2]*f, db:A[3]*f, on:!opt.swapOff[i]};
  }).filter(Boolean);
  const afterSwap={...base};
  swaps.forEach(s=>{ if(s.on){ afterSwap.kcal+=s.dk; afterSwap.e+=s.de; afterSwap.b+=s.db; } });
  if(!opt.adds){
    const adds=[]; let cur={...afterSwap};
    const prodList=products();
    const breakfast = opt.taste==="s";
    const pickBest=(ids,key,gap)=>{
      const c=ids.filter(id=>!adds.includes(id)).map(id=>prodList.find(x=>x.id===id)).filter(Boolean).map(p=>({p,v:pPortion(p)}));
      if(!c.length) return null;
      const enough=c.filter(x=>x.v[key]>=gap).sort((a,b)=>a.v.kcal-b.v.kcal);
      return enough.length?enough[0]:c.sort((a,b)=>b.v[key]-a.v[key])[0];
    };
    const protOrder = breakfast ? ["p_skyr","p_topfen","p_cottage","p_griech","p_eiklar","p_prot"] : ["p_huhn","p_putestreifen","p_skyr","p_edamame","p_cottage","p_thun","p_garnelen"];
    for(let n=0;n<2 && cur.e<45;n++){
      const x=pickBest(protOrder,"e",47-cur.e); if(!x) break;
      adds.push(x.p.id); cur.kcal+=x.v.kcal; cur.e+=x.v.e; cur.b+=x.v.b;
    }
    const fibOrder = breakfast ? ["p_beeren","p_apfel","p_birne","p_leinsamen","p_haferkleie","p_chia","p_hafer"] : ["p_brokkoli","p_kidney","p_linsen","p_erbsen","p_kicher","p_edamame"];
    for(let n=0;n<2 && cur.b<10;n++){
      const x=pickBest(fibOrder,"b",11-cur.b); if(!x) break;
      adds.push(x.p.id); cur.kcal+=x.v.kcal; cur.e+=x.v.e; cur.b+=x.v.b;
    }

  }
  const pw=portionWeight();

  }
  const final={...afterSwap};
  let addG=0;
  const addRows=opt.adds.map(id=>{ const p=productById(id); if(!p) return null; const q=qtyOf(id); const g=qtyGrams(p,q); const v=vForGrams(p,g); const on=!opt.addOff[id]; if(on){ final.kcal+=v.kcal; final.e+=v.e; final.b+=v.b; addG+=g; } return {p,v,on,q,g,label:qtyLabel(p,q)}; }).filter(Boolean);
  (opt.extras||[]).forEach(x=>{ if(x.on!==false){ final.kcal+=x.kcal; final.e+=x.e; final.b+=x.b; addG+=x.g; } });
  return {P, base, swaps, addRows, final, pw, addG};
}

const QNUM="(\\d+\\s*[½¼¾]|\\d+(?:[.,]\\d+)?|½|¼|¾)";
const UNIT="(kg|g|ml|l|EL|TL|Becher|Dosen?|Pkg\\.?|Packung(?:en)?|Prise[n]?|Bund|Scheiben?|Zehen?|St[üu]ck|Stk\\.?|Handvoll|Msp\\.?)";

const QONLY=new RegExp("^\\s*"+QNUM+"\\s*(?:[-–]\\s*"+QNUM+"\\s*)?"+UNIT+"?\\s*$","i");

function gramsFor(food, n, unit, line){

  const u=unit.toLowerCase().replace(".","");
  if(u==="kg"||u==="l") return {g:n*1000};
  if(u==="g"||u==="ml") return {g:n};
  const dry=/Leinsamen|Chiasamen|Sesam|Kakao|Haferflocken|Haferkleie|Mandeln|kerne|Mehl|Zucker|Stärke/.test(name);
  if(u==="el") return {g:n*(fat||dry?10:/Honig|Sirup/.test(name)?20:15)};
  if(u==="tl") return {g:n*(fat||dry?4:5)};
  if(u.startsWith("prise")||u.startsWith("msp")) return {g:0};
  if(u==="becher") return {g:n*(ex.becher||200)};
  if(u.startsWith("dose")) return {g:n*(ex.dose||400)};
  if(u.startsWith("packung")||u==="pkg") return {g:n*250, unsure:true};
  if(u==="bund") return {g:n*50};
  if(u.startsWith("scheibe")) return {g:n*(ex.scheibe||30)};
  if(u.startsWith("zehe")) return {g:n*4};
  if(u==="handvoll") return {g:n*30};
  return piece? {g:n*piece} : {g:n*100, unsure:true};
}
function foodValues(food, line){
  const ex=food[6]||{};
  let v=[food[2],food[3],food[4]];
  if(ex.cooked && /dose|gekocht|abgetropft|vorgegart/i.test(line)) v=ex.cooked;
  if(ex.dry && /getrocknet|trocken|eingeweicht/i.test(line)) v=ex.dry;
  if(ex.saft) v=[25,0.4,0];
  return v;
}
function calcRecipe(txt, name){
  const lines=txt.replace(/\u00a0/g," ").split(/\n/).map(x=>x.replace(/^[-•*\s]+/,"").trim()).filter(Boolean);

  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(QONLY.test(ln)) continue;
    if(ln.length>80 || isHeader(ln)) continue;
    if(name && name.length>3 && ln.toLowerCase().includes(name.toLowerCase()) && !(Q_RE.test(ln)&&/\d/.test(ln)) && !(lines[i+1]&&QONLY.test(lines[i+1]))) continue;
    const food=FOODS.find(f=>f[0].test(ln));
    const zero=ZERO.test(ln);
    if(!food && zero){ const zm=ln.match(Q_RE)||((lines[i+1]&&QONLY.test(lines[i+1]))?lines[i+1].match(Q_RE):null); if(zm&&zm[3]&&/^(g|ml|kg|l)$/i.test(zm[3])&&/wasser|br[üu]he|fond/i.test(ln)){ const gw=qn(zm[1])*(/^(kg|l)$/i.test(zm[3])?1000:1); liquids.push({ln, g:gw}); } }
    if(!food){ if(!zero && /[a-zäöü]{3,}/i.test(ln) && (Q_RE.test(ln) || (lines[i+1]&&QONLY.test(lines[i+1])))) unknown.push(ln); continue; }
    let m=ln.match(Q_RE), qtyLine=i;
    if(m && !m[3] && m.index!==0) m=null;
    if(!m || !/\d|½|¼|¾/.test(m[0])){ m=null;
      for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){ if(QONLY.test(lines[j])){ m=lines[j].match(Q_RE); qtyLine=j; break; } if(FOODS.some(f=>f[0].test(lines[j]))) break; }
    }

    const n=qn(m[1]);

    lastQtyLine=qtyLine; lastQty=m[0].trim();
  }
  const tot={kcal:0,e:0,b:0,g:0};
  let absPot=0, absBoil=0, cooked=0, grain=false;
  items.forEach(it=>{ tot.kcal+=it.v[0]*it.g/100; tot.e+=it.v[1]*it.g/100; tot.b+=it.v[2]*it.g/100;
    const f=cookFactor(it.food,it.ln); it.cg=it.g*f; cooked+=it.cg;
    if(f>1){ const a=it.g*(f-1); if(/Reis|Nudeln/.test(it.food[1])){ absBoil+=a; grain=true; } else absPot+=a; } });
  return {items, unknown, tot, liquids, cooked, absorbed:absPot+absBoil, absPot, absBoil, grain};
}

function estWeight(){
  const C=opt.calc; if(!C) return null;
  let kept=0, drainedAny=false;
  (C.liquids||[]).forEach((l,i)=>{ if(opt.drain&&opt.drain[i]) drainedAny=true; else kept+=l.g; });

  const water = Math.max(0, kept - (C.absPot||0) - (drainedAny?0:(C.absBoil||0)));
  return {total:C.cooked+water, water};
}
function portionWeight(){
  const P=Math.max(1,num(opt.portions)||1);
  const w=num(opt.weight);
  if(w>0) return {g:w/P, measured:true};
  const ew=estWeight();
  if(ew && ew.total>0) return {g:ew.total/P, measured:false, water:ew.water};
  return null;
}
function densityInfo(kcal,g){
  if(!(g>0)) return null;
  const d=kcal/g;
  const lvl = d<0.6?["sehr niedrig","Super – viel Essen für wenig Kalorien."] : d<1.5?["niedrig","Gut zum Abnehmen."] : d<2.5?["mittel","Mit mehr Gemüse oder weniger Fett geht’s leichter."] : ["hoch","Hier lohnt sich Gemüse dazu und Fett zu reduzieren."];
  return {d, lvl};
}
function densityText(kcal,g,measured){
  const di=densityInfo(kcal,g); if(!di) return "";
  return "Portion ca. "+r0(g)+" g"+(measured?"":" (geschätzt)")+" – Energiedichte "+fmt(Math.round(di.d*100)/100)+" kcal/g, "+di.lvl[0]+". "+di.lvl[1];
}

function getMeal(key, slot, create){

function mealTotals(m){

  if(r){ if(r.kcal==null) t.unknown=true; t.kcal+=(r.kcal||0)*m.p; t.e+=(r.e||0)*m.p; t.b+=(r.b||0)*m.p; }
  (m.b||[]).forEach(id=>{ const pp=productById(id); if(pp){ const x=pPortion(pp); t.kcal+=x.kcal; t.e+=x.e; t.b+=x.b; return; } const sw=sweetById(id); if(sw){ t.kcal+=sw.kcal; t.e+=sw.e||0; t.b+=sw.b||0; return; } const x=BBY[id]; if(x){ t.kcal+=x.kcal; t.e+=x.e; t.b+=x.b; } });

  SLOTS.forEach(s=>{ const mt=mealTotals(getMeal(key,s.k,false)); t.meals[s.k]=mt; t.kcal+=mt.kcal; t.e+=mt.e; t.b+=mt.b; if(mt.unknown) t.unknown=true; });

function arc(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos((a-90)*Math.PI/180), cy+r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1); const large=(a1-a0)>180?1:0;
  return "M"+x0.toFixed(2)+" "+y0.toFixed(2)+" A"+r+" "+r+" 0 "+large+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2);
}
function plateSvg(t){

  s+='<circle cx="90" cy="90" r="84" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.5"/>';
  MAIN_SLOTS.forEach((sl,i)=>{
    const a0=i*120+4, a1=i*120+116;
    s+='<path d="'+arc(90,90,64,a0,a1)+'" style="fill:none;stroke:var(--rim)" stroke-width="20" stroke-linecap="round"/>';
    const f=Math.min(t.meals[sl.k].e/T.perMeal,1);
    if(f>0.02) s+='<path d="'+arc(90,90,64,a0,a0+(a1-a0)*f)+'" style="fill:none;stroke:var(--protein)" stroke-width="20" stroke-linecap="round"/>';
  });
  s+='<text x="90" y="88" text-anchor="middle" style="fill:var(--ink);font:700 34px \'Bricolage Grotesque\',sans-serif">'+r0(t.e)+'</text>';
  s+='<text x="90" y="110" text-anchor="middle" style="fill:var(--muted);font:400 13px \'Source Sans 3\',sans-serif">von '+T.e+' g Eiweiß</text>';
  s+='</svg>';

    else if(pl&&!tDone(wk,pl)){ mark.classList.add("planned"); mark.textContent=pl.tag; }
    else { mark.classList.add("rest"); mark.textContent="–"; }
    c.append(mark); days.append(c); }
  v.append(days);
  if(tOpen===null){ const ti=wd(new Date()); const td=UNITS.find(u=>u.day===ti); const fo=UNITS.find(u=>!tDone(wk,u)); tOpen=(tOffset===0&&td&&!tDone(wk,td))?td.key:(fo?fo.key:""); }
  UNITS.forEach(u=>{
    const data=wk.units[u.key]||{s:u.steps.map(()=>false),doneAt:null}, n=data.s.filter(Boolean).length, dn=!!data.doneAt;
    const card=el("section","tunit"+(tOpen===u.key?" open":"")+(dn?" complete":""));
    const head=el("button","tunit-head"); head.setAttribute("aria-expanded",tOpen===u.key?"true":"false");
    const t=el("span","t"); t.append(el("strong",null,u.title), el("span",null, dn? "Erledigt am "+DS[wd(new Date(data.doneAt+"T00:00"))]+", "+new Date(data.doneAt+"T00:00").getDate()+"." : u.dayLabel));
    head.append(el("span","tag",dn?"✓":u.tag), t, el("span","count",n+"/"+u.steps.length), el("span","chev","▾"));
    head.onclick=()=>{ tOpen=tOpen===u.key?"":u.key; render(); };
    const body=el("div","tunit-body"); const ul=el("ul","tsteps");
    u.steps.forEach((s,i)=>{ const li=el("li","tstep"+(data.s[i]?" checked":""));
      const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!data.s[i]; cb.setAttribute("aria-label",s.role+": "+s.name+" erledigt"); cb.onchange=()=>tToggle(u,i,cb.checked);
      const box=el("div","s"); box.append(el("div","role",s.role));
      let a; if(s.id){ a=document.createElement("a"); a.href=yt(s.id); a.target="_blank"; a.rel="noopener"; } else a=el("span","plain"); a.textContent=s.name; box.append(a);
      li.append(cb,box,el("span","min",s.min?s.min+" Min.":"")); ul.append(li); });
    const act=el("div","meal-actions");
    if(!dn){ const b=el("button","btn primary","Alles abhaken"); b.onclick=()=>tSetAll(u,true); act.append(b); }
    if(n>0){ const b=el("button","btn","Zurücksetzen"); b.onclick=()=>tSetAll(u,false); act.append(b); }
    body.append(ul,act); card.append(head,body); v.append(card);
  });
  v.append(el("h2",null,"Dein Fortschritt"));
  let total=0, zoneMin=0, best=0;
  Object.values(tWeeks()).forEach(w2=>{ let c=0; UNITS.forEach(u=>{ const d=w2.units&&w2.units[u.key]; if(d&&d.doneAt){ c++; total++; if(u.key[0]==="z") zoneMin+=45; } }); if(c>best) best=c; });
  const st=el("div","stats"); [[total,"Einheiten gesamt"],[zoneMin,"Minuten Zone 2"],[best+"/6","beste Woche"]].forEach(([a,b])=>{ const s=el("div","stat"); s.append(el("strong",null,String(a)), el("span",null,b)); st.append(s); }); v.append(st);
  v.append(el("p","goal","Erledigte Einheiten der letzten 8 Wochen (von 6)"));
  let svg='<svg viewBox="0 0 360 150" role="img" aria-label="Erledigte Einheiten pro Woche" style="width:100%;height:auto;display:block">';
  [25,60,95].forEach(y=>{ svg+='<line x1="0" x2="360" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-dasharray="2 4"/>'; });
  svg+='<line x1="0" x2="360" y1="120" y2="120" style="stroke:var(--line);stroke-width:1.5"/>';
  for(let i=0;i<8;i++){ const m2=mondayOf(i-7), iw=isoWeek(m2), w2=tPeek(iw.key), c=UNITS.filter(u=>tDone(w2,u)).length, x=i*45+9.5, h=c/6*95, y=120-h;
    if(c>0) svg+='<rect x="'+x+'" y="'+y+'" width="26" height="'+h+'" rx="5" style="fill:'+(c===6?"var(--protein)":"var(--kcal)")+'"/>';
    svg+='<text x="'+(x+13)+'" y="'+(c>0?y-6:114)+'" text-anchor="middle" style="fill:var(--ink);font:600 13px \'Source Sans 3\',sans-serif">'+c+'</text>';
    svg+='<text x="'+(x+13)+'" y="140" text-anchor="middle" style="fill:'+(iw.key===key?"var(--ink)":"var(--muted)")+';font:'+(iw.key===key?"700":"400")+' 12px \'Source Sans 3\',sans-serif">KW '+iw.w+'</text>'; }
  v.insertAdjacentHTML("beforeend", svg+'</svg>');
  v.append(el("p","goal","Tippe eine Einheit an und hake jeden Teil ab. Ist alles abgehakt, zählt die Einheit für diese Woche. Bei Videos ohne Geräte nimmst du die Hanteln einfach dazu."));
}

/* ---------- Sicherung / anderes Gerät ---------- */
function backupCode(){ const json=JSON.stringify({v:1, profile, state}); return "EP1:"+btoa(unescape(encodeURIComponent(json))); }
function readBackup(txt){
  txt=String(txt||"").trim();
  let json;
  if(txt.startsWith("EP1:")) json=decodeURIComponent(escape(atob(txt.slice(4).replace(/\s+/g,""))));
  else json=txt;
  const d=JSON.parse(json);
  if(!d||!d.state) throw new Error("kein Backup");
  return d;
}
function applyBackup(d){
  if(!confirm("Alle Daten auf diesem Gerät für „"+profile+"“ durch die Sicherung ersetzen?")) return false;
  state=normalize(d.state); rebuild(); persist(); if(remote) flush(); render(); return true;
}
function renderBackup(v){
  v.append(el("h2",null,"Auf anderes Gerät übertragen"));
  v.append(el("p","goal","Jedes Gerät (und am iPhone auch die App am Home-Bildschirm) speichert für sich. So nimmst du deinen Plan, dein Gewicht, deine Rezepte und dein Training mit: hier eine Sicherung erstellen, auf dem anderen Gerät einfügen."));
  const f=el("div","addform");
  const r1=el("div","meal-actions");
  const cp=el("button","btn primary","Sicherung kopieren"); cp.type="button";
  const fl=el("button","btn","Als Datei speichern"); fl.type="button";
  r1.append(cp,fl);
  const msg=el("div","flash","");
  cp.onclick=async()=>{ const code=backupCode();
    try{ await navigator.clipboard.writeText(code); msg.textContent="Kopiert – jetzt z. B. per AirDrop, Nachricht oder Mail ans andere Gerät schicken und dort einfügen."; }
    catch(e){ ta.value=code; ta.select(); msg.textContent="Der Code steht unten im Feld – lange drücken, „Alles auswählen“, „Kopieren“."; } };
  fl.onclick=()=>{ try{ const blob=new Blob([JSON.stringify({v:1,profile,state})],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="essensplan-sicherung-"+slug(profile)+"-"+ymd(new Date())+".json"; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); msg.textContent="Datei gespeichert (am iPhone unter „Dateien“)."; }catch(e){ msg.textContent="Speichern als Datei geht hier nicht – nimm „Sicherung kopieren“."; } };
  const ta=document.createElement("textarea"); ta.className="field"; ta.rows=3; ta.placeholder="Sicherung vom anderen Gerät hier einfügen …"; ta.style.padding="10px 14px";
  const r2=el("div","meal-actions");
  const ap=el("button","btn primary","Sicherung übernehmen"); ap.type="button";
  const fi=document.createElement("input"); fi.type="file"; fi.accept=".json,application/json"; fi.hidden=true;
  const fb=el("button","btn","Datei laden"); fb.type="button"; fb.onclick=()=>fi.click();
  ap.onclick=()=>{ try{ const d=readBackup(ta.value); if(applyBackup(d)) alert("Sicherung übernommen."); }catch(e){ msg.textContent="Das ist keine gültige Sicherung. Bitte den ganzen Code einfügen."; } };
  fi.onchange=()=>{ const file=fi.files&&fi.files[0]; if(!file) return; file.text().then(t=>{ try{ if(applyBackup(readBackup(t))) alert("Sicherung übernommen."); }catch(e){ msg.textContent="Die Datei ist keine gültige Sicherung."; } }); };
  r2.append(ap,fb);
  f.append(r1, ta, r2, fi, msg); v.append(f);
}

/* ---------- Gewicht ---------- */
function renderGewicht(){
  const v=$("v-gewicht"); v.innerHTML="";
  v.append(el("h2",null,"Deine Tagesziele"));
  const tf=el("div","addform");
  const tfld=(lab,inp)=>{ const w=el("div"); const l=el("label",null,lab); l.htmlFor=inp.id; w.append(l,inp); return w; };
  const ti=(id,val)=>{ const i=document.createElement("input"); i.id=id; i.type="number"; i.className="field"; i.inputMode="numeric"; i.value=val; return i; };
  const k1=ti("tk1",T.kcalLow), k2=ti("tk2",T.kcal), e1=ti("te1",T.e);
  const tg=el("div","addgrid"); tg.append(tfld("kcal von",k1),tfld("kcal bis",k2),tfld("Eiweiß g",e1));
  const s1=ti("tsw",T.sweet); const tg2=el("div","addgrid two"); tg2.append(tfld("Süßes pro Tag (kcal)",s1));
  const tb=el("button","btn primary","Ziele speichern"); tb.type="button";
  tb.onclick=()=>{ const a=num(k1.value), b=num(k2.value), c=num(e1.value); if(!(a>0&&b>=a&&c>0)) return; state.targets={kcalLow:a,kcal:b,e:c,eLow:Math.round(c*0.9),sweet:Math.max(0,num(s1.value)||0)}; rebuild(); persist(); tb.textContent="Gespeichert"; };
  tf.append(tg,tg2,tb); v.append(tf);
  v.append(el("h2",null,"Gewicht eintragen"));
  const f=el("form","wform");
  const w1=el("div"); const l1=el("label",null,"Gewicht in kg"); l1.htmlFor="wkg";
  const kg=document.createElement("input"); kg.id="wkg"; kg.className="field"; kg.type="text"; kg.inputMode="decimal"; kg.placeholder="z. B. 94,6"; kg.autocomplete="off"; kg.oninput=()=>kg.setCustomValidity(""); kg.required=true;
  w1.append(l1,kg);
  const w2=el("div"); const l2=el("label",null,"Datum"); l2.htmlFor="wdate";
  const dt=document.createElement("input"); dt.id="wdate"; dt.className="field"; dt.type="date"; dt.value=ymd(dateAt(0)); dt.required=true;
  w2.append(l2,dt);
  const sb=el("button","btn primary","Speichern"); sb.type="submit";
  f.append(w1,w2,sb);
  f.onsubmit=e=>{ e.preventDefault(); const val=parseFloat(String(kg.value).trim().replace(",",".")); if(!(val>=30&&val<=300)||!dt.value){ kg.setCustomValidity("Bitte ein Gewicht wie 94,6 eingeben"); kg.reportValidity(); return; } kg.setCustomValidity("");
    state.weights=state.weights.filter(x=>x.d!==dt.value); state.weights.push({d:dt.value,kg:Math.round(val*10)/10}); state.weights.sort((a,b)=>a.d<b.d?-1:1); persist(); render(); };
  v.append(f);

  const W=state.weights;
  if(!W.length){ renderBackup(v); v.append(el("p","empty","Trag am besten einmal pro Woche dein Gewicht ein, immer zur gleichen Tageszeit. Der erste Eintrag ist dein Startwert, das Ziel liegt "+GOAL_LOSS+" kg darunter.")); return; }
  const start=W[0].kg, cur=W[W.length-1].kg, goal=Math.round((start-GOAL_LOSS)*10)/10, lost=Math.round((start-cur)*10)/10;
  const st=el("div","stats");
  [[fmt(lost)+" kg","abgenommen"],[fmt(Math.max(0,Math.round((cur-goal)*10)/10))+" kg","noch bis zum Ziel"],[fmt(goal)+" kg","Zielgewicht"]].forEach(([a,b])=>{ const s=el("div","stat"); s.append(el("strong",null,a), el("span",null,b)); st.append(s); });
  v.append(st);

  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.id="wchart"; svg.setAttribute("viewBox","0 0 360 170"); svg.setAttribute("role","img"); svg.setAttribute("aria-label","Gewichtsverlauf");
  const pts=W.slice(-16); const hi=Math.max(start,...pts.map(p=>p.kg))+1, lo=Math.min(goal,...pts.map(p=>p.kg))-1;
  const y=k=>10+(hi-k)/(hi-lo)*130; const x=i=>pts.length===1?180:20+i*(320/(pts.length-1));
  let s='<line x1="10" x2="350" y1="'+y(goal).toFixed(1)+'" y2="'+y(goal).toFixed(1)+'" style="stroke:var(--protein)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<text x="350" y="'+(y(goal)-6).toFixed(1)+'" text-anchor="end" style="fill:var(--protein);font:600 12px \'Source Sans 3\',sans-serif">Ziel '+fmt(goal)+' kg</text>';
  if(pts.length>1) s+='<polyline points="'+pts.map((p,i)=>x(i).toFixed(1)+","+y(p.kg).toFixed(1)).join(" ")+'" style="fill:none;stroke:var(--kcal)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{ s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.kg).toFixed(1)+'" r="4" style="fill:var(--surface);stroke:var(--kcal)" stroke-width="2.5"/>'; });
  const fd=d=>{ const q=new Date(d+"T00:00"); return q.getDate()+"."+(q.getMonth()+1)+"."; };
  s+='<text x="'+x(0).toFixed(1)+'" y="162" text-anchor="'+(pts.length===1?"middle":"start")+'" style="fill:var(--muted);font:400 12px \'Source Sans 3\',sans-serif">'+fd(pts[0].d)+'</text>';
  if(pts.length>1) s+='<text x="'+x(pts.length-1).toFixed(1)+'" y="162" text-anchor="end" style="fill:var(--muted);font:400 12px \'Source Sans 3\',sans-serif">'+fd(pts[pts.length-1].d)+'</text>';
  svg.innerHTML=s; v.append(svg);

  const ul=el("ul","wlist");
  W.slice().reverse().forEach(p=>{
    const li=el("li"); const q=new Date(p.d+"T00:00");
    li.append(el("span",null, DS[wd(q)]+", "+q.getDate()+". "+MONTHS[q.getMonth()]+": "+fmt(p.kg)+" kg"));
    const del=el("button",null,"×"); del.setAttribute("aria-label","Eintrag vom "+q.getDate()+". "+MONTHS[q.getMonth()]+" löschen");
    del.onclick=()=>{ state.weights=state.weights.filter(x=>x.d!==p.d); persist(); render(); };
    li.append(del); ul.append(li);
  });
  v.append(ul);
  renderBackup(v);
}

/* ---------- Ablauf ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===view?"true":"false"));
  ["tag","woche","training","rezepte","opt","gewicht"].forEach(k=>$("v-"+k).hidden = k!==view);
  if(view==="tag") renderTag(); else if(view==="woche") renderWoche(); else if(view==="rezepte") renderRezepte(); else if(view==="opt") renderOpt(); else if(view==="training") renderTraining(); else renderGewicht();
  flashMsg={slot:"",text:""};
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ view=b.dataset.v; render(); }));

function setSync(t){ $("sync").textContent=t; }
function persist(){
  try{ localStorage.setItem(lsKey(), JSON.stringify(state)); }catch(e){}
  if(!remote) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving){ pending=true; return; }
  saving=true; setSync("Speichert …");
  try{ await remote.set(JSON.parse(JSON.stringify(state))); setSync("Gespeichert"); }
  catch(e){ setSync("Nur auf diesem Gerät gespeichert"); }
  saving=false;
  if(pending){ pending=false; flush(); }
}
async function getServices(){
  if(services!==null) return services;
  services=false;
  if(!(window.claude && typeof window.claude.use==="function")) return services;
  try{
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(user&&db){ const uid=await user.id(); if(uid) services={db,uid}; }
  }catch(e){}
  return services;
}
function normalize(d){
  const s={days:{},weights:[],custom:[]};
  if(d&&typeof d==="object"){ if(d.days&&typeof d.days==="object") s.days=d.days; if(Array.isArray(d.weights)) s.weights=d.weights; if(Array.isArray(d.custom)) s.custom=d.custom; if(Array.isArray(d.products)) s.products=d.products; if(d.targets&&typeof d.targets==="object") s.targets=d.targets; if(d.training&&typeof d.training==="object"&&d.training.weeks) s.training=d.training; if(Array.isArray(d.sweets)) s.sweets=d.sweets; if(Array.isArray(d.productsDel)) s.productsDel=d.productsDel; if(Array.isArray(d.omitAlways)) s.omitAlways=d.omitAlways; }
  return s;
}
async function startProfile(name){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; if(remote){ remote.set(JSON.parse(JSON.stringify(state))).catch(()=>{}); } }
  profile=name.trim();
  const p=readProfiles(); if(!p.names.includes(profile)) p.names.push(profile); p.last=profile; writeProfiles(p);
  state={days:{},weights:[],custom:[]}; remote=null; dayOffset=0; tOffset=0; tOpen=null; view="tag"; setSync("");
  try{ const raw=localStorage.getItem(lsKey()); if(raw) state=normalize(JSON.parse(raw)); }catch(e){}
  rebuild();
  $("whoName").textContent=profile;
  $("gate").hidden=true; $("app").hidden=false;
  render();
  const mine=profile;
  const s=await getServices();
  if(!s||mine!==profile) return;
  try{
    const ref=s.db.doc("data/users/"+s.uid+"/essen_"+slug(profile));
    const snap=await ref.get();
    if(mine!==profile) return;
    remote=ref;
    if(snap.exists && snap.data()){
      state=normalize(JSON.parse(JSON.stringify(snap.data()))); rebuild();
      try{ localStorage.setItem(lsKey(), JSON.stringify(state)); }catch(e){}
      render();
    } else if(Object.keys(state.days).length || state.weights.length || state.custom.length || (state.training&&Object.keys(state.training.weeks||{}).length)){ flush(); }
  }catch(e){ setSync("Nur auf diesem Gerät gespeichert"); }
}
function showGate(){
  const p=readProfiles();
  const list=$("known"); list.innerHTML="";
  p.names.forEach(n=>{ const b=el("button","btn",n); b.type="button"; b.onclick=()=>startProfile(n); list.append(b); });
  $("knownWrap").hidden=!p.names.length;
  $("app").hidden=true; $("gate").hidden=false; $("nameInput").value="";
}
$("gateForm").addEventListener("submit",e=>{ e.preventDefault(); const v=$("nameInput").value.trim(); if(v) startProfile(v); });
$("switch").addEventListener("click",showGate);
async function loadRecipeFile(){
  try{
    const res=await fetch("rezepte.json",{cache:"no-store"});
    if(!res.ok) return;
    const data=await res.json();
    if(!Array.isArray(data)) return;
    const ok=data.filter(r=>r&&typeof r.id==="string"&&typeof r.n==="string"&&(r.cat==="f"||r.cat==="h"));
    if(!ok.length) return;
    baseList=ok; rebuild(); if(profile) render();
  }catch(e){}
}
rebuild();
loadRecipeFile();
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
const initP=readProfiles();
if(initP.last) startProfile(initP.last); else showGate();
})();
</script>
